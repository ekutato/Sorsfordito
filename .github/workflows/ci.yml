name: CI

on:
  push:
    branches: [main, 'claude/**']
  pull_request:
  workflow_dispatch:

jobs:
  web:
    name: Web - tipusellenorzes, tesztek, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm test
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: sorsfordito-web
          path: out/
          retention-days: 14

  android:
    name: Android - debug APK
    runs-on: ubuntu-latest
    needs: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      # Az ubuntu-latest futtatón az Android SDK előre telepítve van (ANDROID_HOME)
      - run: echo "sdk.dir=$ANDROID_HOME" > android/local.properties
      - run: npm ci
      - run: npm run android:sync
      - name: Gradle assembleDebug
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: sorsfordito-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          retention-days: 30
