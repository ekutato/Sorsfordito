name: CI

on:
  push:
    branches: [main, 'claude/**']
  pull_request:
  workflow_dispatch:

jobs:
  web:
    name: Web - tipusellenorzes, tesztek, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm test
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: sorsfordito-web
          path: out/
          retention-days: 14

  android:
    name: Android - debug APK
    runs-on: ubuntu-latest
    needs: web
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      # Az ubuntu-latest futtatón az Android SDK előre telepítve van (ANDROID_HOME)
      - run: echo "sdk.dir=$ANDROID_HOME" > android/local.properties
      - run: npm ci
      - run: npm run android:sync
      - name: Gradle assembleDebug
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: sorsfordito-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          retention-days: 30
      - name: APK atnevezese
        run: cp android/app/build/outputs/apk/debug/app-debug.apk sorsfordito-teszt.apk
      # Allando letoltesi oldal: https://github.com/ekutato/Sorsfordito/releases/tag/teszt-apk
      - name: Teszt APK kiadas frissitese
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: teszt-apk
          name: Teszt APK (legfrissebb)
          prerelease: true
          make_latest: false
          target_commitish: ${{ github.sha }}
          files: sorsfordito-teszt.apk
          body: |
            Automatikusan frissülő tesztváltozat (debug, aláíratlan).
            Ág: ${{ github.ref_name }} · commit: ${{ github.sha }}

            Telepítés: töltsd le lent az Assets alatt a sorsfordito-teszt.apk fájlt a telefonodra,
            nyisd meg, és engedélyezd a telepítést ebből a forrásból. Ha a Play Protect
            figyelmeztet, válaszd a "Telepítés mindenképp" lehetőséget.
